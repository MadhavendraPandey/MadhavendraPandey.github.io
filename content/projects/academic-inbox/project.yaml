tagline: A local intelligence layer for academic WhatsApp groups.
summary: >
  A Windows-first system for bringing academic messages and files into one
  local archive through Beeper Desktop. The project brings together deduplication,
  organization, search, and local AI around information that is otherwise scattered
  across group conversations. This overview describes the system direction;
  individual capabilities remain under development.
